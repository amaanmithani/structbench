[project]
name = "structbench"
version = "0.1.0"
description = "How reliably do LLMs produce valid structured output, by method? A small, honest benchmark against a local Ollama model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.23"]

[project.scripts]
structbench = "structbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=structbench --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["structbench"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_tasks.py" = ["E501"]  # hand-written task data: long literal lines
